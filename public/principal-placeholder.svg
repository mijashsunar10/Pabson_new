  <!-- collar and tie -->
  <path d="M86 88 L100 104 L114 88" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M100 104 L94 112 L100 128 L106 112 Z" fill="#ffffff"/>
  <!-- open book -->
