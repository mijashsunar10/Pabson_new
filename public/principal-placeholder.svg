  <path d="M100 126 V174" stroke="#ffffff" stroke-width="3"/>
  <!-- redraw hands over the book edges -->
  <circle cx="52" cy="150" r="13" fill="#111111" stroke="#ffffff" stroke-width="3"/>
  <circle cx="148" cy="150" r="13" fill="#111111" stroke="#ffffff" stroke-width="3"/>
