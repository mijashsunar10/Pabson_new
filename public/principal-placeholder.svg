<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#ffffff"/>
  <g fill="#111111">
    <!-- head -->
    <ellipse cx="100" cy="52" rx="24" ry="28"/>
    <!-- body -->
    <path d="M52 176 V122 Q52 92 82 88 H118 Q148 92 148 122 V176 Z"/>
    <!-- pointer stick -->
